[global]
status = rtl-sdr.local
hardware = sdr
mode = iq
#iface = lo
ttl = 0
verbose = 0
fft-threads = 4
data = rtl-sdr-pcm.local

# To switch SDRs: comment out the active [sdr] block and uncomment the other.
# Also set SDRPLAY=1 in your .env file (or environment) when using SDRplay.

[sdr]
device = rtlsdr
agc = 1
#gain = 24
#bias = true
samprate = 2400000
frequency = 432000000
description=rtl
#calibrate = -1e-6
#serial=UHF_SDR

# [sdr]
# device = sdrplay
# description = RSP1B
# #serial =
# #antenna = Antenna C
# samprate = 4000000        ; default is 2M
# lna-state = 1
# if-agc = yes
# if-agc-rate = 0
# if-agc-setpoint-dbfs = -20
# if-agc-decay-delay-ms = 500
# # bias-t = true
