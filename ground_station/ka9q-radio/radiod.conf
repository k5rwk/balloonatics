[global]
status = rtl-sdr.local
hardware = rtlsdr
mode = iq
#iface = lo
ttl = 0
verbose = 1
fft-threads = 4
data = rtl-sdr-pcm.local

[rtlsdr]
device = rtlsdr
agc = 1
#gain = 24
#bias = true
samprate = 2400000
frequency = 432000000
description=rtl
#calibrate = -1e-6
#serial=UHF_SDR

# If receiving Wenet, you must specify it in this config file as well.
# Adding it to "general" stream above will overload pcmrecord on Pi platform.
[wenet-1]
data = wenet-1-pcm.local
freq = 431104000 # for 431.200
# freq = 431404000 # for 431.500
mode = linear
samprate = 480000
low =  +0
high = +192000
stereo = yes
#headroom = -60

[wenet-2]
data = wenet-2-pcm.local
freq = 431404000 # for 431.500
mode = linear
samprate = 480000
low =  +0
high = +192000
stereo = yes
#headroom = -60

[wenet-3]
data = wenet-3-pcm.local
freq = 431704000 # for 431.800
# freq = 431404000 # for 431.500
mode = linear
samprate = 480000
low =  +0
high = +192000
stereo = yes
#headroom = -60

# APRS / packet channel for the direwolf TNC.
# Packet/APRS needs FLAT audio. 'demod = fm' alone still applies the preset's
# default de-emphasis, which rolls off the 2200 Hz mark tone ~6 dB/oct vs 1200 Hz
# and breaks Bell 202 -- so de-emphasis and threshold extension are disabled
# explicitly here (matching [aprs-9600], which decodes fine). Squelch is forced
# fully open so audio streams continuously to direwolf.
# Static channel => persistent, auto SSRC = freq in kHz = 433000 (see radio.c).
[aprs]
data = aprs-433000-pcm.local
freq = 433000000 # 433.000 MHz
demod = fm
samprate = 48k
low =  -8k
high = +8k
snr-squelch = no
deemph-tc = 0
deemph-gain = 0
threshold-extend = no
squelch-open = -100
squelch-close = -100

[aprs-9600]
data = aprs-9600-433000-pcm.local
freq = 433000000 # 433.000 MHz

demod = fm
samprate = 48k
low =  -8k
high = +8k
filter2 = 0
deemph-tc = 0
deemph-gain = 0
threshold-extend = no ; dont interfere with packet, digital, etc
pll = no
square = no
mono = yes
shift = 0
conj = no
snr-squelch = no

# -----------------------------------------------------------------------------
# Horus Binary channels (one dedicated PCM stream each).
#
# Previously these were tuned DYNAMICALLY by docker_ka9q_single.sh and all shared
# the [global] data stream (rtl-sdr-pcm.local). Every horus pcmrecord then joined
# that one multicast group and received ALL channels' IQ packets, so the kernel
# replicated each packet to every socket (O(N^2)) -> ~35% sys + softirq CPU.
#
# Defining them statically gives each its own avahi-advertised stream, so each
# pcmrecord only receives its own IQ -> O(N). The script no longer needs `tune`.
#
# mode=iq is inherited from [global]. Static SSRC is auto = freq in kHz
# (e.g. 432500), which docker_ka9q_single.sh derives as RXFREQ/1000.
# low/high = +/- RXBANDWIDTH/2 (RXBANDWIDTH=10000 -> +/-5000).
[horus-432500]
data = horus-432500-pcm.local
freq = 432500000
samprate = 48000
low = -11000
high = +11000

[horus-432520]
data = horus-432520-pcm.local
