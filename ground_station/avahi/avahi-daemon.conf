# Avahi config for the containerised, LAN-isolated ka9q registry.
#
# allow-interfaces=lo + the container's own netns means mDNS never leaves this
# container. Resolution still works because libnss-mdns talks to this daemon
# over the shared unix socket and it answers from its in-memory record set --
# no on-the-wire multicast required.
[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=lo
ratelimit-interval-usec=1000000
ratelimit-burst=1000
enable-dbus=yes

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-addresses=yes
publish-aaaa-on-ipv4=no
