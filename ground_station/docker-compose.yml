x-common-variables: &common-variables
  MYCALL: CHANGEME

# Common config for the Horus decoder service (horus-server). Kept as an anchor
# so additional instances are easy to add if a host ever needs to scale out.
x-horus-server: &horus-server
  image: balloonatics/horusdemodlib:local
  build:
    context: ./horusdemodlib
  restart: 'always'
  environment:
    # Only Python process left in the horus path, so the glibc arena tuning
    # lives here now (the feeders are pure pcmrecord/bash).
    MALLOC_ARENA_MAX: "2"
    MALLOC_TRIM_THRESHOLD_: "131072"
  working_dir: /tmp
  volumes:
    - type: 'tmpfs'
      target: '/tmp'
    - type: 'bind'
      source: './horusdemodlib/user.cfg'
      target: '/user.cfg'
  network_mode: 'host'

# Shared avahi-socket mount, reused by every consumer that resolves *.local names.
x-avahi-vol: &avahi-vol
  type: 'volume'
  source: 'avahi-socket'
  target: '/run/avahi-daemon'

# Common config for the 26 horus feeders. They differ ONLY in SDR_DEVICE +
# RXFREQ (set per service); everything else is shared.
#
# A/B method switch (DEMODSCRIPT picks the feeder script; both are mounted):
#   * EDGE-DSP (default): DEMODSCRIPT=docker_ka9q_server.sh -- feeder demods in
#     native C and ships text; horus-server runs uploader_server.py. ~34% CPU.
#   * AUDIO-SERVER (test): DEMODSCRIPT=docker_ka9q_audio.sh -- feeder ships raw IQ;
#     horus-server runs `python3 -m horusdemodlib.server`. Change BOTH this line
#     and the horus-server command below to switch.
x-horus-feeder-env: &horus-feeder-env
  DEMODSCRIPT: "docker_ka9q_audio.sh"
  RXBANDWIDTH: 22000
  SAMPLERATE: 24000

x-horus-feeder: &horus-feeder
  image: balloonatics/horusdemodlib:local
  build:
    context: ./horusdemodlib
  restart: 'always'
  command: 'bash -c $${DEMODSCRIPT}'
  volumes:
    - type: 'tmpfs'
      target: '/tmp'
    - type: 'bind'
      source: './horusdemodlib/user.cfg'
      target: '/user.cfg'
    - *avahi-vol
    - type: 'bind'
      source: './horusdemodlib/docker_ka9q_server.sh'
      target: '/usr/bin/docker_ka9q_server.sh'
      read_only: true
    - type: 'bind'
      source: './horusdemodlib/docker_ka9q_audio.sh'
      target: '/usr/bin/docker_ka9q_audio.sh'
      read_only: true
  depends_on:
    - avahi
    - horus-server
    - ka9q-radio
  network_mode: 'host'

# Common config for the wenet receivers. They differ in RXFREQ, DEVICE,
# IMAGE_PORT, WEB_PORT and their rx_images bind path (set per service).
x-wenet-env: &wenet-env
  BAUD_RATE: 96000
  OVERSAMPLING: 5
  FRAMING_MODE: 'wenet_ldpc'
  UDP_PORT: 55672
  SDR_TYPE: 'KA9Q'
  UPLOAD_ENABLE: 1

x-wenet: &wenet
  image: ghcr.io/ke5gdb/wenet:testing
  restart: 'always'
  depends_on:
    - avahi
  network_mode: 'host'

# Named volumes used to share the containerised avahi's sockets: the D-Bus
# socket (radiod publishes records over it) and the avahi control socket
# (every consumer's libnss-mdns resolves over it).
volumes:
  avahi-socket:
  avahi-dbus:

services:

  # LAN-isolated Avahi/mDNS registry for the ka9q stack. Runs in its OWN network
  # namespace (no host networking) so it never announces on the LAN. radiod
  # publishes stream names here via D-Bus; consumers resolve them via the unix
  # socket; both over the shared volumes above. The host's own avahi-daemon is
  # left untouched, so <host>.local still works on the LAN.
  avahi:
    build: ./avahi
    container_name: ka9q-avahi
    restart: 'always'
    volumes:
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
      - type: 'volume'
        source: 'avahi-dbus'
        target: '/run/dbus'

  # ka9q-radio SDR service
  ka9q-radio:
    security_opt:
      - apparmor:unconfined
    #build: https://github.com/snh/dockerfiles.git#main:ka9q-radio
    build: ./ka9q-radio
    restart: 'always'
    cap_add:
      - CAP_NET_ADMIN
      - CAP_SYS_NICE
    container_name: ka9q-radio
    depends_on:
      - avahi
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    environment:
      # Set SDRPLAY=1 to start the SDRplay API service daemon before radiod.
      # Also update radiod.conf: comment out [sdr] device=rtlsdr
      # and uncomment [sdr] device=sdrplay.
      SDRPLAY: 0
    network_mode: host
    tty: true
    volumes:
      - ./ka9q-radio/radiod.conf:/etc/radio/radiod.conf:ro
      - ./ka9q-radio/wisdomf:/etc/fftw/wisdomf
      - ./ka9q-radio/wisdom:/var/lib/ka9q-radio/wisdom
      # Publish to the containerised avahi over its private D-Bus, not the host's.
      - type: 'volume'
        source: 'avahi-dbus'
        target: '/run/dbus'

  # Web spectrum analyzer: drives ka9q-radio's `powers` against the SDR status
  # group and serves a live FFT + waterfall over HTTP/SSE. Uses host networking
  # (multicast), so it binds PORT directly on the host -- change PORT to move it
  # (default 8000). Resolves *.local via the shared avahi socket, like the feeders.
  #
  # Center frequency, span (-> bins) and the status group are DERIVED from the
  # mounted radiod.conf, so tuning lives in one place. BIN_WIDTH (resolution) and
  # the display/integration knobs are the only things set here. Logs (LOG_DIR)
  # are written as replayable powers CSV for after-the-fact flight review.
  spectrum:
    build: ./spectrum
    image: balloonatics/spectrum:local
    restart: 'always'
    environment:
      PORT: 8000
      BIN_WIDTH: 1000        # Hz per FFT bin (resolution); span = samprate / this
      INTERVAL: 0.025        # seconds between FFT polls = display update rate (40 Hz)
      SMOOTHING: 0.2         # default browser IIR tau (s); adjustable live in the UI
      LOG_DIR: /data         # where spectrum CSV logs are written
      LOG_INTERVAL: 0        # >0 (seconds) auto-starts logging at boot
      # FREQUENCY / BINS / MCAST auto-derive from radiod.conf below; set them here
      # only to override. CROSSOVER defaults to the full span (forces powers'
      # narrowband path -> full two-sided spectrum); see spectrum/README.md.
    volumes:
      - *avahi-vol
      - ./ka9q-radio/radiod.conf:/etc/radio/radiod.conf:ro
      - ./spectrum/logs:/data
    depends_on:
      - avahi
      - ka9q-radio
    network_mode: 'host'

  chasemapper:
    image: ghcr.io/projecthorus/chasemapper:latest
    restart: 'always'
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyUSB0"
    volumes:
      - type: 'bind'
        source: './chasemapper/horusmapper.cfg'
        target: '/opt/chasemapper/horusmapper.cfg'
      - type: 'bind'
        source: './chasemapper/log_files/'
        target: '/opt/chasemapper/log_files/'
      - type: 'bind'
        source: './chasemapper/gfs/'
        target: '/opt/chasemapper/gfs/'
      - type: 'bind'
        source: './maps/'
        target: '/opt/chasemapper/Maps/'
    network_mode: 'host'

  maptilesdownloader:
    image: ghcr.io/ke5gdb/maptilesdownloader:testing
    restart: 'always'
    network_mode: host
    tty: true
    volumes:
      - ./maps/:/opt/MapTilesDownloader/output/

  wenet-431200:
    <<: *wenet
    environment:
      <<: [*common-variables, *wenet-env]
      RXFREQ: 431200000
      DEVICE: 'wenet-1-pcm.local'
      IMAGE_PORT: 7891
      WEB_PORT: 5003
    volumes:
      - type: 'bind'
        source: './wenet-1/rx_images/'
        target: '/opt/wenet/rx_images/'
      - *avahi-vol

  wenet-431500:
    <<: *wenet
    environment:
      <<: [*common-variables, *wenet-env]
      RXFREQ: 431500000
      DEVICE: 'wenet-2-pcm.local'
      IMAGE_PORT: 7892
      WEB_PORT: 5004
    volumes:
      - type: 'bind'
        source: './wenet-2/rx_images/'
        target: '/opt/wenet/rx_images/'
      - *avahi-vol

  wenet-431800:
    <<: *wenet
    environment:
      <<: [*common-variables, *wenet-env]
      RXFREQ: 431800000
      DEVICE: 'wenet-3-pcm.local'
      IMAGE_PORT: 7893
      WEB_PORT: 5005
    volumes:
      - type: 'bind'
        source: './wenet-3/rx_images/'
        target: '/opt/wenet/rx_images/'
      - *avahi-vol

  # Direwolf TNC fed FM audio from ka9q-radio (pcmrecord -> direwolf stdin).
  # The channel is defined statically in ka9q-radio/radiod.conf ([aprs]) with
  # squelch forced open, so audio streams continuously and direwolf doesn't EOF.
  # SDR_DEVICE/SAMPRATE must match that channel; SSRC is derived as RXFREQ/1000.
  direwolf-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 1200
      STARTUP_JITTER: 0
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  direwolf-9600-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-9600-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 9600
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  # Shared horus-server. Two interchangeable methods (see the feeder A/B note
  # above); switch the command here AND the feeders' DEMODSCRIPT together:
  #   * EDGE-DSP (default): uploader_server.py just decodes the text the native
  #     feeders send and uploads. One cheap instance serves all channels (~34% CPU).
  #   * AUDIO-SERVER (test): server.py demodulates raw IQ in-process across a
  #     multiprocessing pool and uploads. Comment/uncomment to switch.
  horus-server:
    <<: *horus-server
    # command: 'python3 /usr/local/bin/uploader_server.py -c /user.cfg --tcp-port 4921'
    command: 'python3 -m horusdemodlib.server -c /user.cfg --tcp-port 4921'  # AUDIO-SERVER method

