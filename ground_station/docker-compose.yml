    depends_on:
      - avahi
    network_mode: 'host'

  # Direwolf TNC fed FM audio from ka9q-radio (pcmrecord -> direwolf stdin).
  # The channel is defined statically in ka9q-radio/radiod.conf ([aprs]) with
  # squelch forced open, so audio streams continuously and direwolf doesn't EOF.
  # SDR_DEVICE/SAMPRATE must match that channel; SSRC is derived as RXFREQ/1000.
  direwolf-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 1200
      STARTUP_JITTER: 0
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  direwolf-9600-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-9600-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 9600
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  # Receiver instance name (e.g. "horus-434200" or "wenet-443500")
  horus-432500:
    image: balloonatics/horusdemodlib:local
    build:
      context: ./horusdemodlib
    restart: 'always'
    environment:
      # Change this to match the PCM device defined in
      SDR_DEVICE: horus-432500-pcm.local
      STATS_OUTPUT: 0
      DECODER: horus_demod
      DEMODSCRIPT: "docker_ka9q_single.sh"
      # Receive *centre* frequency, in Hz
      RXFREQ: 432500000
      # Frequency estimator bandwidth. The wider the bandwidth, the more drift and frequency error the modem can tolerate,
      # but the higher the chance that the modem will lock on to a strong spurious signal.
      RXBANDWIDTH: 22000
    command: 'bash -c $${DEMODSCRIPT}'
    volumes:
      - type: 'tmpfs'
        target: '/tmp'
      - type: 'bind'
        source: './horusdemodlib/user.cfg'
        target: '/user.cfg'
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
      - type: 'bind'
        source: './horusdemodlib/docker_ka9q_single.sh'
        target: '/usr/bin/docker_ka9q_single.sh'
        read_only: true
    depends_on:
      - avahi
    network_mode: 'host'

