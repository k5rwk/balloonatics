  # wenet-431800:
  #   <<: *wenet
  #   environment:
  #     <<: [*common-variables, *wenet-env]
  #     RXFREQ: 431800000
  #     DEVICE: 'wenet-431800-pcm.local'
  #     IMAGE_PORT: 7893
  #     WEB_PORT: 5005
  #   volumes:
  #     - type: 'bind'
  #       source: './wenet-431800/rx_images/'
  #       target: '/opt/wenet/rx_images/'
  #     - *avahi-vol

  # Direwolf TNC fed FM audio from ka9q-radio (pcmrecord -> direwolf stdin).
  # The channel is defined statically in ka9q-radio/radiod.conf ([aprs]) with
  # squelch forced open, so audio streams continuously and direwolf doesn't EOF.
  # SDR_DEVICE/SAMPRATE must match that channel; SSRC is derived as RXFREQ/1000.
  direwolf-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 1200
      STARTUP_JITTER: 0
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  direwolf-9600-433000:
    build: ./direwolf
    restart: 'always'
    environment:
      <<: *common-variables
      SDR_DEVICE: aprs-9600-433000-pcm.local
      RXFREQ: 433000000
      SAMPRATE: 48000
      BAUD_RATE: 9600
    volumes:
      - type: 'bind'
        source: './direwolf/direwolf.conf'
        target: '/direwolf.conf'
        read_only: true
      - type: 'bind'
        source: './direwolf/docker_ka9q_direwolf.sh'
        target: '/usr/bin/docker_ka9q_direwolf.sh'
        read_only: true
      - type: 'volume'
        source: 'avahi-socket'
        target: '/run/avahi-daemon'
    depends_on:
      - avahi
    network_mode: 'host'

  # Shared horus-server. render_user_cfg.sh fills callsign/comments from
  # MYCALL/RADIO_COMMENT/ANTENNA_COMMENT into /tmp/user.cfg, then exec's the server.
  horus-server:
    <<: *horus-server
    command: '/usr/bin/render_user_cfg.sh python3 -m horusdemodlib.server -c /tmp/user.cfg --tcp-port 4921'

  # Receiver instance name (e.g. "horus-434200" or "wenet-443500")
  horus-432500:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-432500-pcm.local
      RXFREQ: 432500000

  horus-432600:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-432600-pcm.local
      RXFREQ: 432600000

  horus-432700:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-432700-pcm.local
      RXFREQ: 432700000

  horus-432800:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-432800-pcm.local
      RXFREQ: 432800000

  horus-432900:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-432900-pcm.local
      RXFREQ: 432900000

  horus-433000:
    <<: *horus-feeder
    environment:
      <<: *horus-feeder-env
      SDR_DEVICE: horus-433000-pcm.local
      RXFREQ: 433000000
