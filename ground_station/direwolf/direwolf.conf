#############################################################
#                                                           #
#  Direwolf configuration - ka9q-radio piped audio (stdin)  #
#                                                           #
#############################################################

# Audio comes in on stdin from pcmrecord (see docker_ka9q_direwolf.sh).
# The sample rate / baud are passed on the direwolf command line (-r / -B),
# so they don't need to be repeated here.
ADEVICE stdin null
ACHANNELS 1

CHANNEL 0
# Set your callsign here (or override the whole file via a compose bind mount).
MYCALL MYCALL

MODEM 1200

# Receive-only ka9q channel: no transmit, so no PTT line is configured.

# --- APRS-IS uplink (optional) ---------------------------------------------
# Uncomment and fill in to forward decoded packets to APRS-IS.
IGSERVER noam.aprs2.net
IGLOGIN MYCALL 00000

# --- AGW / KISS network interfaces -----------------------------------------
AGWPORT 8000
KISSPORT 8001
