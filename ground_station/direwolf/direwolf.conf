#############################################################
#                                                           #
#  Direwolf configuration - ka9q-radio piped audio (stdin)  #
#                                                           #
#############################################################

# Audio comes in on stdin from pcmrecord (see docker_ka9q_direwolf.sh).
# The sample rate / baud are passed on the direwolf command line (-r / -B),
# so they don't need to be repeated here.
ADEVICE stdin null
ACHANNELS 1

CHANNEL 0
# MYCALL / IGLOGIN are rendered at startup by docker_ka9q_direwolf.sh from the
# compose MYCALL variable (the passcode is computed automatically). The __MYCALL__
# / __PASSCODE__ tokens below are the substitution targets -- edit MYCALL in
# docker-compose.yml, not here.
MYCALL __MYCALL__

MODEM 1200

# Receive-only ka9q channel: no transmit, so no PTT line is configured.

# --- APRS-IS uplink (optional) ---------------------------------------------
# Forwards decoded packets to APRS-IS, logging in as MYCALL with the computed
# passcode. The startup script comments this line out if MYCALL is unset/CHANGEME.
IGSERVER noam.aprs2.net
IGLOGIN __MYCALL__ __PASSCODE__

# --- AGW / KISS network interfaces -----------------------------------------
# Disabled (0): nothing connects to direwolf over AGW/KISS here -- decoded
# packets go straight to APRS-IS via IGSERVER above. Leaving AGWPORT at its
# default (8000) also collided with the spectrum web UI on host networking.
AGWPORT 0
KISSPORT 0
